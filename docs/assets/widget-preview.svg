<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <title>ClaudeMeter — mockup del widget F1</title>

  <!-- fondo de escritorio simulado -->
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3a55"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="860" height="360" rx="14" fill="url(#desktop)"/>
  <rect x="20" y="20" width="860" height="360" rx="14" fill="url(#glow)"/>
  <rect x="20" y="20" width="860" height="360" rx="14" fill="none" stroke="#0a0e16" stroke-width="1"/>

  <!-- barra de tareas simulada, solo para dar contexto de "escritorio" -->
  <rect x="20" y="348" width="860" height="32" rx="0" fill="#0d1420" fill-opacity="0.7"/>
  <circle cx="46" cy="364" r="8" fill="#3a4a63"/>
  <rect x="64" y="358" width="70" height="12" rx="3" fill="#28374d"/>

  <!-- MainWindow: sin bordes, topmost, esquina inferior derecha, margen 16px -->
  <g filter="url(#shadow)">
    <rect x="574" y="184" width="286" height="146" rx="10" fill="#20232a" fill-opacity="0.93"/>

    <!-- Sesión -->
    <text x="598" y="222" fill="#9aa0ab" font-size="11" font-weight="600" letter-spacing="1">SESIÓN</text>
    <rect x="598" y="230" width="238" height="10" rx="5" fill="#3a3f4b"/>
    <rect x="598" y="230" width="121" height="10" rx="5" fill="#3fb950"/>
    <text x="598" y="256" fill="#cfd3da" font-size="12">51% · quedan 237 min</text>

    <!-- Semana -->
    <text x="598" y="284" fill="#9aa0ab" font-size="11" font-weight="600" letter-spacing="1">SEMANA</text>
    <rect x="598" y="292" width="238" height="10" rx="5" fill="#3a3f4b"/>
    <rect x="598" y="292" width="195" height="10" rx="5" fill="#d29922"/>
    <text x="598" y="318" fill="#cfd3da" font-size="12">82% · quedan 605 min</text>
  </g>

  <!-- etiqueta señalando la ventana -->
  <text x="574" y="170" fill="#c9d1d9" font-size="13" font-weight="600">MainWindow (280×140, sin bordes, topmost)</text>

  <!-- leyenda de umbrales: tarjeta clara propia, ilegible-proof frente a README en modo oscuro -->
  <rect x="20" y="392" width="860" height="72" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="38" y="414" fill="#57606a" font-size="12" font-weight="600">Color por umbral (US-3)</text>

  <circle cx="46" cy="440" r="7" fill="#3fb950"/>
  <text x="60" y="444" fill="#24292f" font-size="12">Normal — &lt; 70%</text>

  <circle cx="216" cy="440" r="7" fill="#d29922"/>
  <text x="230" y="444" fill="#24292f" font-size="12">Advertencia — 70–90%</text>

  <circle cx="426" cy="440" r="7" fill="#f85149"/>
  <text x="440" y="444" fill="#24292f" font-size="12">Crítico — ≥ 90%</text>

  <circle cx="626" cy="440" r="7" fill="#5a6070"/>
  <text x="640" y="444" fill="#24292f" font-size="12">Sin datos / desactualizado</text>
</svg>
